[package]
name = "tesseract"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
http = "1"
memmap2 = "0.9"
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v7"] }

cuda-async = { git = "https://github.com/NVlabs/cutile-rs.git", rev = "9fe5756f861bc40f098e6981ac2dff6cf5d3d0e4", optional = true }
cuda-core = { git = "https://github.com/NVlabs/cutile-rs.git", rev = "9fe5756f861bc40f098e6981ac2dff6cf5d3d0e4", optional = true }
cutile = { git = "https://github.com/NVlabs/cutile-rs.git", rev = "9fe5756f861bc40f098e6981ac2dff6cf5d3d0e4", optional = true }
cutile-compiler = { git = "https://github.com/NVlabs/cutile-rs.git", rev = "9fe5756f861bc40f098e6981ac2dff6cf5d3d0e4", optional = true }
cudarc = { version = "=0.19.2", default-features = false, features = ["std", "cublas", "dynamic-loading", "cuda-13010"], optional = true }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[features]
default = []
cuda = [
    "dep:cuda-async",
    "dep:cuda-core",
    "dep:cutile",
    "dep:cutile-compiler",
    "dep:cudarc",
]
test-backend = []

[[bin]]
name = "model-check"
path = "src/bin/model-check.rs"

[[bin]]
name = "cuda-check"
path = "src/bin/cuda-check.rs"
required-features = ["cuda"]

[[bin]]
name = "model-cuda-check"
path = "src/bin/model-cuda-check.rs"
required-features = ["cuda"]
